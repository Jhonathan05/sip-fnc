# Plantilla FNC en Docker (ejemplo sin secretos — copiar a docker-compose.yml y completar)
# Up: docker compose -p <APP_NAME> up -d --build
name: sip-fnc

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sip-fnc-app
    restart: "no"
    environment:
      APP_NAME: sip-fnc
      PORT: 3020
      APP_BASE: http://localhost:3020
      AUTH_PROVIDER: mock
      MOCK_ROLES: admin
      CLIENT_ROLES: admin,coordinador,consultor,analista,auxiliar
      RATE_LIMIT_API_PER_MIN: 60
      # Solo keycloak (staging/prod, client registrado en fnc-realm):
      KEYCLOAK_URL: http://fnc-keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: http://localhost:8080/auth
      KEYCLOAK_REALM:
      KEYCLOAK_CLIENT_ID:
      KEYCLOAK_CLIENT_SECRET:
      SESSION_SECRET:
    ports:
      - '3020:3020'
    networks:
      - infra-net

  # Postgres dev local (Docker Desktop). Prod usa el Postgres del host FNC.
  db:
    image: postgres:16-alpine
    container_name: sip-fnc-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip-dev-sololocal
      POSTGRES_DB: sip_fnc
    ports:
      - '5433:5432'
    volumes:
      - sip-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sip']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sip-dev-pgdata:

networks:
  infra-net:
    external: true
